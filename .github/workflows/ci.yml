name: COTIW CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  godot-import:
    name: Godot project import & parse check
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import project (validates parse + assets)
        run: godot --headless --import || true

      - name: Re-run import to flush warnings
        run: godot --headless --import

      - name: Run automated checks (placeholder)
        run: echo "TODO Sprint 2: GUT test suite"

