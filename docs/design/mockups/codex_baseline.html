<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鎮島錄 · 圖鑑視覺基準（codex baseline）</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script>
// ── design_tokens.json → Tailwind（單一真相，嚴格沿用；radii 全 0 = 像素銳角）──
tailwind.config = { theme: { extend: {
  colors: {
    cinnabar:'#8E2A1C', gold:'#E8C46A', oldgold:'#A47D2A', cream:'#F0E4C8',
    jade:'#46C99A', festred:'#D94A2B', tempred:'#A62F1F', lacquer:'#1A0F0D',
    ink:'#120A09', wood:'#4B2D22', smoke:'#8B7C73', ash:'#D7C4A5',
    hp:'#D64646', armor:'#E7B94C', cyan:'#4EC8E5', purple:'#6E4AA8', warn:'#FF9F43',
  },
  fontFamily:{ tc:['"Noto Sans TC"','sans-serif'] },
  fontSize:{ display:['48px','1.1'], h1:['36px','1.15'], h2:['28px','1.2'],
    body:['22px','1.35'], caption:['18px','1.3'], micro:['16px','1.2'] },
  spacing:{ xs:'8px', sm:'12px', md:'16px', lg:'24px', xl:'32px', xxl:'48px' },
  borderRadius:{ none:'0', DEFAULT:'0' },
  boxShadow:{ panel:'0 4px 12px rgba(0,0,0,.30)', glow:'0 0 14px rgba(232,196,106,.45)',
    glowj:'0 0 12px rgba(70,201,154,.35)' },
}}}
</script>
<style>
  *{ border-radius:0 !important; image-rendering:pixelated; }
  body{ background:
    radial-gradient(120% 90% at 50% -10%, #2a1410 0%, #160c0a 45%, #0c0605 100%);
    overflow:hidden; }
  /* 廟殿掃線質感（克制，低透明） */
  .scan::after{ content:''; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 2px, transparent 2px 4px); opacity:.25; }
  .pulse{ animation:pg 1.6s ease-in-out infinite; }
  @keyframes pg{ 0%,100%{ box-shadow:0 0 0 rgba(232,196,106,0); } 50%{ box-shadow:0 0 16px rgba(232,196,106,.55);} }
  .skel{ background:linear-gradient(100deg,#241410 30%,#3a2118 50%,#241410 70%); background-size:200% 100%;
    animation:sk 1.1s linear infinite; } @keyframes sk{ to{ background-position:-200% 0; } }
  ::-webkit-scrollbar{ width:10px; } ::-webkit-scrollbar-thumb{ background:#4B2D22; } ::-webkit-scrollbar-track{ background:#160c0a; }
  .sheet{ transition:transform .26s cubic-bezier(.2,.8,.2,1); }
</style>
</head>
<body class="font-tc text-cream antialiased">
<div class="scan relative w-screen h-screen flex flex-col p-lg gap-md select-none">

  <!-- ── TopBar ── -->
  <header class="flex items-center gap-lg shrink-0">
    <button class="h-[56px] px-md border-2 border-oldgold bg-lacquer/80 text-gold text-h2 leading-none hover:border-gold hover:shadow-glow" aria-label="返回">‹</button>
    <h1 class="text-h1 font-black text-gold tracking-wide">圖鑑</h1>
    <div class="flex-1"></div>
    <div class="flex items-center gap-sm">
      <span class="text-caption text-ash">總完成度</span>
      <div class="w-[220px] h-[18px] bg-[#2a1410] border border-oldgold relative">
        <div id="ovBar" class="h-full bg-jade shadow-glowj" style="width:59%"></div>
      </div>
      <span class="text-caption text-gold font-bold tabular-nums">124 / 210 · 59%</span>
    </div>
    <!-- 態切換（dev only：示範四態，非產品 UI） -->
    <div class="flex items-center gap-xs ml-md pl-md border-l border-wood">
      <span class="text-micro text-wood/90">DEV·態</span>
      <button onclick="setState('ok')"   class="stbtn text-micro px-sm h-[40px] border border-smoke text-ash">成功</button>
      <button onclick="setState('load')" class="stbtn text-micro px-sm h-[40px] border border-smoke text-ash">載入</button>
      <button onclick="setState('err')"  class="stbtn text-micro px-sm h-[40px] border border-smoke text-ash">錯誤</button>
      <button onclick="setState('empty')" class="stbtn text-micro px-sm h-[40px] border border-smoke text-ash">空</button>
    </div>
  </header>

  <!-- ── Body：Sidebar + Content ── -->
  <div class="flex-1 flex gap-lg min-h-0">

    <!-- Sidebar -->
    <nav id="tabs" class="w-[200px] shrink-0 flex flex-col gap-xs" role="tablist" aria-label="圖鑑分類"></nav>

    <!-- Content -->
    <section class="flex-1 flex flex-col gap-md min-w-0">
      <!-- CategoryHeader -->
      <div class="flex items-center gap-lg shrink-0">
        <h2 id="catName" class="text-h2 font-bold text-gold whitespace-nowrap">卡圖收藏</h2>
        <div class="w-[180px] h-[16px] bg-[#2a1410] border border-oldgold relative">
          <div id="catBar" class="h-full bg-jade" style="width:75%"></div>
        </div>
        <span id="catNum" class="text-caption text-gold font-bold tabular-nums whitespace-nowrap">42 / 56 · 75%</span>
        <div class="flex-1"></div>
        <button class="text-caption px-md h-[44px] border-2 border-oldgold text-cream hover:border-gold">全部 ▾</button>
        <button class="text-caption px-md h-[44px] border-2 border-oldgold text-cream hover:border-gold">稀有 ▾</button>
        <div class="relative">
          <input placeholder="搜尋…" class="text-caption pl-[34px] pr-md h-[44px] w-[200px] bg-lacquer/70 border-2 border-oldgold text-cream placeholder:text-smoke focus:border-gold outline-none">
          <span class="absolute left-sm top-1/2 -translate-y-1/2 text-smoke">🔍</span>
        </div>
      </div>
      <!-- Grid / States -->
      <div class="flex-1 overflow-y-auto pr-xs min-h-0">
        <div id="grid" class="grid gap-md" style="grid-template-columns:repeat(6,minmax(0,1fr))"></div>
      </div>
    </section>
  </div>

  <!-- ── DetailSheet ── -->
  <div id="scrim" onclick="closeSheet()" class="fixed inset-0 bg-black/60 opacity-0 pointer-events-none transition-opacity duration-200 z-40"></div>
  <aside id="sheet" class="sheet fixed left-0 right-0 bottom-0 h-[62%] translate-y-full bg-[#1a0f0d] border-t-[3px] border-gold shadow-panel z-50 p-xl flex gap-xl" role="dialog" aria-modal="true">
    <div id="shArt" class="w-[280px] shrink-0 border-2 border-gold"></div>
    <div class="flex-1 flex flex-col gap-md min-w-0">
      <div class="flex items-center gap-md">
        <h3 id="shName" class="text-display font-black text-gold"></h3>
        <span id="shRar" class="text-caption px-sm py-[2px] border-2"></span>
        <span id="shCost" class="text-h2 text-cream"></span>
      </div>
      <p id="shEff" class="text-body text-cream/90 max-w-[680px]"></p>
      <div class="flex-1"></div>
      <p id="shSrc" class="text-caption text-ash"></p>
      <button onclick="closeSheet()" class="self-start text-caption px-lg h-[52px] border-2 border-oldgold text-gold hover:border-gold hover:shadow-glow">關閉</button>
    </div>
  </aside>
</div>

<script>
// ── 內容（取樣 COTIW；owned=已收 / false=未解鎖）──
const CATS = [
  {id:'cards', name:'卡圖收藏', cols:6, owned:42, total:56, items:[
    ['破煞','符',1,'common','削去敵方煞盾 6。',true],['護身符','技',1,'common','獲得 5 點護身符。',true],
    ['驅邪光','攻',2,'uncommon','造成 9 點傷害，破煞 +3。',true],['速描符','技',1,'common','抽 1 張牌。',true],
    ['重擊','攻',2,'common','造成 12 點傷害。',true],['火符','攻',2,'uncommon','造成 8 點傷害並附 3 灼。',true],
    ['雷符','攻',3,'rare','對全體造成 7 點雷傷。',true],['護壇','技',1,'uncommon','母壇獲得 8 護。',true],
    ['合符','技',2,'rare','合兩張符令成更強符。',true],['召靈','技',3,'rare','召喚一名神將助戰。',false],
    ['大破煞','符',3,'epic','破煞 +12，溢出轉傷害。',false],['聖光','攻',4,'epic','造成 20 點神聖傷害。',false],
    ['封煞','符',2,'uncommon','封印敵方一個意圖。',true],['續符','技',1,'common','下回合多 1 神力。',true],
    ['爆竹','攻',1,'common','造成 4 點傷害兩次。',true],['鎮邪','符',3,'rare','造成 10 並眩暈。',false],
  ]},
  {id:'fu', name:'符令', cols:6, owned:18, total:24, items:[
    ['平安符','符',1,'common','回合結束回 4 元神。',true],['驅煞符','符',2,'uncommon','破煞 +5。',true],
    ['雷令','符',3,'rare','造成 9 雷傷。',true],['五雷符','符',4,'epic','對全體 12 雷傷。',false],
  ]},
  {id:'jia', name:'家將', cols:4, owned:6, total:8, items:[
    ['甘將軍','將',0,'rare','前營鎮守，攔煞 +20%。',true],['柳將軍','將',0,'rare','後營，回合回護。',true],
    ['謝將軍','將',0,'epic','七爺，破煞特化。',true],['范將軍','將',0,'epic','八爺，控場眩暈。',false],
  ]},
  {id:'deity', name:'神明', cols:3, owned:4, total:6, items:[
    ['虎爺','神',0,'rare','請神：全體破煞。',true],['媽祖','神',0,'epic','請神：母壇大護。',true],
    ['城隍','神',0,'epic','請神：審判全場。',false],['關聖','神',0,'epic','請神：神威斬煞。',false],
  ]},
  {id:'enemy', name:'敵人', cols:6, owned:9, total:14, items:[
    ['椅仔姑','煞',0,'common','椅仔姑，附身少女煞。',true],['山豬精','煞',0,'common','衝撞型山煞。',true],
  ]},
  {id:'relic', name:'遺物', cols:6, owned:28, total:40, items:[
    ['香爐','物',0,'uncommon','戰鬥開始多 1 神力。',true],['紅線','物',0,'rare','合符不耗回合。',true],
  ]},
  {id:'consum', name:'消耗品', cols:6, owned:0, total:8, items:[]},  // ← 空態示範
];
const RAR = { common:{c:'#A47D2A',t:'常'}, uncommon:{c:'#46C99A',t:'良'}, rare:{c:'#4EC8E5',t:'稀'}, epic:{c:'#E8C46A',t:'神'} };
let cur = 0, state = 'ok';

function renderTabs(){
  document.getElementById('tabs').innerHTML = CATS.map((c,i)=>{
    const pct = Math.round(c.owned/c.total*100);
    const sel = i===cur;
    return `<button role="tab" aria-selected="${sel}" onclick="pick(${i})"
      class="text-left px-md py-sm border-l-[5px] ${sel?'border-festred bg-[#571c17]/70':'border-transparent bg-lacquer/40 hover:bg-[#2a1410]'} min-h-[64px]">
      <div class="flex justify-between items-baseline"><span class="text-caption ${sel?'text-gold':'text-cream'}">${c.name}</span>
        <span class="text-micro text-ash tabular-nums">${c.owned}/${c.total}</span></div>
      <div class="mt-xs h-[6px] bg-[#2a1410]"><div class="h-full ${sel?'bg-jade':'bg-oldgold'}" style="width:${pct}%"></div></div>
    </button>`;
  }).join('');
}
function pick(i){ cur=i; state='ok'; renderTabs(); renderHead(); renderGrid(); }
function setState(s){ state=s; renderGrid(); }
function renderHead(){
  const c = CATS[cur], pct = Math.round(c.owned/c.total*100);
  document.getElementById('catName').textContent = c.name;
  document.getElementById('catNum').textContent = `${c.owned} / ${c.total} · ${pct}%`;
  document.getElementById('catBar').style.width = pct+'%';
  document.getElementById('grid').style.gridTemplateColumns = `repeat(${c.cols},minmax(0,1fr))`;
}
function renderGrid(){
  const g = document.getElementById('grid'), c = CATS[cur];
  if(state==='load'){ g.style.gridTemplateColumns=`repeat(${c.cols},minmax(0,1fr))`;
    g.innerHTML = Array(c.cols*2).fill(`<div class="skel h-[180px] border border-wood"></div>`).join(''); return; }
  if(state==='err'){ g.style.gridTemplateColumns='1fr';
    g.innerHTML = `<div class="flex flex-col items-center justify-center gap-md py-xxl text-center">
      <div class="text-display opacity-40">⟳</div><p class="text-body text-ash">載入收藏失敗</p>
      <button onclick="setState('ok')" class="text-caption px-lg h-[52px] border-2 border-gold text-gold">⟳ 重試</button></div>`; return; }
  if(state==='empty' || c.items.length===0){ g.style.gridTemplateColumns='1fr';
    g.innerHTML = `<div class="flex flex-col items-center justify-center gap-md py-xxl text-center">
      <div class="text-display opacity-30">🗒️</div><p class="text-body text-ash">尚未收藏任何「${c.name}」</p>
      <p class="text-caption text-smoke">在遶境戰鬥／寶箱中取得後，會自動登錄圖鑑</p></div>`; return; }
  renderHead();
  g.innerHTML = c.items.map((it,idx)=>{
    const [name,type,cost,rar,eff,owned] = it;
    if(!owned) return `<button onclick="lockShake(this)" class="group relative h-[180px] bg-[#1a0f0d] border-2 border-wood flex flex-col items-center justify-center gap-sm">
      <span class="text-h1 opacity-30">🔒</span><span class="text-caption text-ash">？？？</span></button>`;
    const r = RAR[rar]; const errSlot = (idx===4); // 示範單格載圖失敗
    // 暗‧立繪為主（對齊真實卡面：深廟殿圖 + 稀有框），框色＝稀有度，名條夜底米白字（克制 + 對比達標）
    const art = errSlot
      ? `<div class="flex-1 flex flex-col items-center justify-center bg-[#160c0a] gap-xs"><span class="text-h2 opacity-40">⟳</span><span class="text-micro text-smoke">重試</span></div>`
      : `<div class="flex-1 relative flex items-center justify-center" style="background:radial-gradient(120% 90% at 50% 32%, ${r.c}26, #0e0706 78%)">
          <span class="text-display font-black opacity-20" style="color:${r.c}">${type}</span>
          ${cost>0?`<span class="absolute top-xs left-xs text-caption font-bold text-gold tabular-nums leading-none">${cost}</span>`:''}
          <span class="absolute top-xs right-xs text-micro px-[5px] border bg-[#0e0706]/70 leading-none" style="color:${r.c};border-color:${r.c}">${type}</span>
        </div>`;
    return `<button onclick='openSheet(${JSON.stringify(it)})' class="group relative h-[180px] bg-[#160c0a] border-[3px] flex flex-col hover:-translate-y-[3px] hover:shadow-glow transition" style="border-color:${r.c}">
      ${art}
      <div class="px-xs py-[5px] text-caption text-cream font-bold text-center truncate bg-[#1a0f0d] border-t" style="border-color:${r.c}66">${name}</div>
    </button>`;
  }).join('');
}
function lockShake(el){ el.animate([{transform:'translateX(0)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],{duration:160}); }
function openSheet(it){
  const [name,type,cost,rar,eff] = it; const r = RAR[rar];
  document.getElementById('shName').textContent = name;
  document.getElementById('shRar').textContent = r.t+'階'; document.getElementById('shRar').style.color=r.c; document.getElementById('shRar').style.borderColor=r.c;
  document.getElementById('shCost').textContent = cost>0?`神力 ${cost}`:'';
  document.getElementById('shEff').textContent = eff;
  document.getElementById('shSrc').textContent = '取得來源：第一章 · 遶境戰鬥獎勵';
  document.getElementById('shArt').style.background = `linear-gradient(160deg,${r.c}33,#160c0a 70%)`;
  document.getElementById('sheet').classList.remove('translate-y-full');
  const s=document.getElementById('scrim'); s.classList.remove('opacity-0','pointer-events-none');
}
function closeSheet(){ document.getElementById('sheet').classList.add('translate-y-full');
  const s=document.getElementById('scrim'); s.classList.add('opacity-0','pointer-events-none'); }
// URL param（截圖/分享用）：?cat=N&s=load|err|empty&card=1
const P = new URLSearchParams(location.search);
if(P.has('cat')) cur = Math.max(0, Math.min(CATS.length-1, +P.get('cat')));
renderTabs(); renderHead();
if(P.has('s')) state = P.get('s');
renderGrid();
if(P.get('card')==='1'){ const it = CATS[cur].items.find(x=>x[5]); if(it) openSheet(it); }
</script>
</body>
</html>
